name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full lowercase commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.candidate_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Validate requested candidate SHA
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: if ($env:CANDIDATE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'candidate_sha must be a full lowercase commit SHA.' }
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
      - name: Verify source commit
        shell: powershell
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_SHA) { throw 'Checked-out commit does not match the requested SHA.' }
          if (-not [string]::IsNullOrWhiteSpace((git status --porcelain))) { throw 'Candidate checkout is not clean.' }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            [void](git symbolic-ref -q HEAD)
            if ($LASTEXITCODE -eq 0) { throw 'Candidate checkout must be detached.' }
          }
      - name: Windows self-test
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File .\CodexUsageWidget.ps1 -SelfTest
      - name: Windows contract
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\fixtures\Test-Contract.ps1 -PackageRoot .
      - name: Windows data boundary
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\fixtures\Test-WindowsDataBoundary.ps1 -PackageRoot .
      - name: Windows worker stability
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\fixtures\Test-WorkerStability.ps1 -PackageRoot .
      - name: Windows launcher regression
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File .\fixtures\Test-Launcher.ps1 -PackageRoot .
      - name: Windows release package
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\fixtures\Test-ReleasePackage.ps1 -PackageRoot .
      - name: Windows bootstrap integration
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\fixtures\Test-Bootstrap.ps1 -PackageRoot .
      - name: Build Windows artifacts
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Build-Windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\dist\candidate\CodexUsageWidget-v1.1.0-windows.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: |
            dist/candidate/CodexUsageWidget-v1.1.0-windows.exe
            dist/candidate/CodexUsageWidget-v1.1.0-windows.exe.sha256
            dist/candidate/CodexUsageWidget-v1.1.0-windows.zip
            dist/candidate/CodexUsageWidget-v1.1.0-windows.zip.sha256
          if-no-files-found: error

  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Validate requested candidate SHA
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
      - name: Verify source commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            ! git symbolic-ref -q HEAD
          fi
      - name: Test macOS core
        shell: bash
        run: |
          set -euo pipefail
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          SCREENSHOT_DIR="/tmp/codex-widget-screenshots"
          mkdir -p "$SCREENSHOT_DIR"
          test "$VERSION_VALUE" = "1.1.0"
          xcodebuild -version
          set +e
          CODEX_SCREENSHOT_DIR="$SCREENSHOT_DIR" xcodebuild -project macos/CodexUsageWidget.xcodeproj \
            -scheme CodexUsageWidget \
            -destination 'platform=macOS' \
            -derivedDataPath .build \
            MARKETING_VERSION="$VERSION_VALUE" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/macos-test.log"
          XCODE_STATUS=${PIPESTATUS[0]}
          set -e
          if (( XCODE_STATUS != 0 )); then
            grep -E 'error:|Testing failed|BUILD FAILED' "$RUNNER_TEMP/macos-test.log" | tail -n 40 | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              echo "::error title=macOS build::$line"
            done
            exit "$XCODE_STATUS"
          fi
          test -s "$SCREENSHOT_DIR/widget-ring-macos.png"
          test -s "$SCREENSHOT_DIR/widget-details-macos.png"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-demo-screenshots
          path: |
            /tmp/codex-widget-screenshots/widget-ring-macos.png
            /tmp/codex-widget-screenshots/widget-details-macos.png
          if-no-files-found: error
      - name: Build and verify unsigned Universal app
        shell: bash
        run: |
          set -euo pipefail
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          xcodebuild -project macos/CodexUsageWidget.xcodeproj \
            -scheme CodexUsageWidget \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .build \
            MARKETING_VERSION="$VERSION_VALUE" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP=.build/Build/Products/Release/CodexUsageWidget.app
          ARCHITECTURES="$(lipo -archs "$APP/Contents/MacOS/CodexUsageWidget")"
          [[ " $ARCHITECTURES " == *" arm64 "* ]]
          [[ " $ARCHITECTURES " == *" x86_64 "* ]]
          test "$(plutil -extract LSMultipleInstancesProhibited raw -o - "$APP/Contents/Info.plist")" = "true"
          SETTINGS="$(xcodebuild -project macos/CodexUsageWidget.xcodeproj -scheme CodexUsageWidget -configuration Release -showBuildSettings)"
          grep -q 'ENABLE_APP_SANDBOX = NO' <<<"$SETTINGS"
          grep -q 'ENABLE_HARDENED_RUNTIME = YES' <<<"$SETTINGS"
          for locale in en-US zh-CN zh-TW ja-JP ko-KR; do
            cmp "locales/$locale.json" "$APP/Contents/Resources/locales/$locale.json"
          done
          mkdir -p dist/candidate
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/candidate/CodexUsageWidget-v1.1.0-macos-unsigned.zip
          (cd dist/candidate && shasum -a 256 CodexUsageWidget-v1.1.0-macos-unsigned.zip > CodexUsageWidget-v1.1.0-macos-unsigned.zip.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned
          path: |
            dist/candidate/CodexUsageWidget-v1.1.0-macos-unsigned.zip
            dist/candidate/CodexUsageWidget-v1.1.0-macos-unsigned.zip.sha256
          if-no-files-found: error

  candidate:
    if: github.event_name != 'pull_request'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
      - name: Verify detached candidate source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          ! git symbolic-ref -q HEAD
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-unsigned'
          path: candidate
          merge-multiple: true
      - name: Verify and describe unsigned candidate
        id: manifest
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $PWD 'candidate'
          $expected = @(
            'CodexUsageWidget-v1.1.0-macos-unsigned.zip',
            'CodexUsageWidget-v1.1.0-macos-unsigned.zip.sha256',
            'CodexUsageWidget-v1.1.0-windows.exe',
            'CodexUsageWidget-v1.1.0-windows.exe.sha256',
            'CodexUsageWidget-v1.1.0-windows.zip',
            'CodexUsageWidget-v1.1.0-windows.zip.sha256'
          ) | Sort-Object
          $actual = @([IO.Directory]::GetFiles($candidate) | ForEach-Object { [IO.Path]::GetFileName($_) } | Sort-Object)
          if (($actual -join "`n") -cne ($expected -join "`n")) { throw 'Unsigned candidate inventory mismatch.' }
          foreach ($name in @(
            'CodexUsageWidget-v1.1.0-macos-unsigned.zip',
            'CodexUsageWidget-v1.1.0-windows.exe',
            'CodexUsageWidget-v1.1.0-windows.zip'
          )) {
            $hash = (Get-FileHash -LiteralPath (Join-Path $candidate $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            $line = [IO.File]::ReadAllText((Join-Path $candidate ($name + '.sha256')), [Text.Encoding]::ASCII).TrimEnd("`r", "`n")
            if ($line -cne ($hash + '  ' + $name)) { throw "Checksum mismatch: $name" }
          }
          $assets = @($expected | ForEach-Object {
            $path = Join-Path $candidate $_
            [ordered]@{
              name = $_
              bytes = ([IO.FileInfo]$path).Length
              sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          })
          $readme = Join-Path $PWD 'README.md'
          Copy-Item -LiteralPath $readme -Destination (Join-Path $candidate 'README.md')
          $manifest = [ordered]@{
            schemaVersion = 1
            stage = 'unsigned-candidate'
            version = '1.1.0'
            commitSha = $env:CANDIDATE_SHA
            workflowRunId = [long]$env:GITHUB_RUN_ID
            readmeSha256 = (Get-FileHash -LiteralPath $readme -Algorithm SHA256).Hash.ToLowerInvariant()
            assets = $assets
          }
          $manifestPath = Join-Path $candidate 'candidate-manifest.json'
          [IO.File]::WriteAllText($manifestPath, (($manifest | ConvertTo-Json -Depth 6) + "`n"), [Text.UTF8Encoding]::new($false))
          $manifestHash = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(($manifestPath + '.sha256'), ($manifestHash + '  candidate-manifest.json' + "`n"), [Text.Encoding]::ASCII)
          "manifest_sha=$manifestHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Upload bound unsigned candidate
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-candidate-v1.1.0-${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          path: candidate/*
          if-no-files-found: error
          retention-days: 30
      - name: Record candidate binding
        shell: bash
        run: |
          echo "Artifact ID: ${{ steps.upload.outputs.artifact-id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact digest: ${{ steps.upload.outputs.artifact-digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Manifest SHA-256: ${{ steps.manifest.outputs.manifest_sha }}" >> "$GITHUB_STEP_SUMMARY"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-candidate-v1.1.0-${{ github.sha }}
          path: candidate
      - name: Publish unsigned prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## v1.1.0 unsigned preview / 未签名预发布版

          - Windows: unsigned EXE and portable ZIP
          - macOS: unsigned Universal app ZIP for Apple silicon and Intel Macs, macOS 13+
          - Five interface languages and eight themes
          - Local session observation only; no Web API calls or telemetry

          Windows files are not Authenticode-signed. The macOS app is not signed or notarized. On first launch, use Finder → Open, or System Settings → Privacy & Security → Open Anyway. Verify the included SHA-256 files before running.

          Windows 文件尚未进行 Authenticode 签名；macOS 应用尚未进行 Developer ID 签名与苹果公证。首次打开 macOS 应用时，请使用访达右键“打开”，或前往“系统设置 → 隐私与安全性 → 仍要打开”。运行前请核对随附的 SHA-256。
          EOF
          gh release create "$GITHUB_REF_NAME" \
            candidate/CodexUsageWidget-v1.1.0-* \
            --prerelease \
            --verify-tag \
            --title "Codex Usage Widget v1.1.0 (Unsigned Preview)" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --repo "$GITHUB_REPOSITORY"
